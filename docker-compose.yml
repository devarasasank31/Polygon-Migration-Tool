# Local infrastructure for the Polygon Migration Tool.
#   docker compose up -d
# PostgreSQL (required), Redis (test-case cache), MinIO (S3-compatible object storage).
# Host ports are overridable via environment variables so they can be adapted when a
# local PostgreSQL/Redis is already running (e.g. POSTGRES_HOST_PORT=5434).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: polygon_migration
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["${POSTGRES_HOST_PORT:-5433}:5432"]
    volumes: ["./.docker-data/postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d polygon_migration"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports: ["${REDIS_HOST_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage with a web console (http://localhost:9001).
  # The MinIO vendor no longer publishes public images on Docker Hub; the
  # bitnamilegacy/minio image is the last publicly pullable MinIO image and
  # creates MINIO_DEFAULT_BUCKETS automatically on first start.
  minio:
    image: bitnamilegacy/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DEFAULT_BUCKETS: testcases   # created automatically on first start
      MINIO_BROWSER: "on"
      MINIO_CONSOLE_PORT_NUMBER: 9001
    ports: ["9000:9000", "9001:9001"]   # 9000 = S3 API, 9001 = web console
    volumes: ["./.docker-data/minio:/bitnami/minio/data"]
